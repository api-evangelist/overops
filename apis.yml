aid: overops
name: Overops
description: >-
  OverOps (formerly Takipi) is a continuous reliability platform that helps teams
  who ship software ensure rapid code changes do not degrade the customer
  experience. It runs in the cloud or on-premises, instruments Java and .NET
  applications with a micro-agent, and automatically identifies, prevents, and
  resolves critical software issues across CI/CD, testing, and production. OverOps
  captures true root-cause code snapshots (stack, source, and variable state) at the
  moment of failure and exposes everything through a REST API that lets admins and
  users automate every action available in the OverOps UI. OverOps was acquired by
  Harness; overops.com now redirects to harness.io, while the developer API,
  documentation, and application hosts remain live.
