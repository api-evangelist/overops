        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: getServicesByEnvIdSettingsCodeRedactionExcludeClasses
      x-operation-id-source: derived
  /services/{env_id}/settings/code-redaction/exclude/classes/{class_name}:
    get:
      tags:
      - Code Redaction
      summary: Retrieve an excluded class
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      - in: path
        name: class_name
        required: true
        description: Fully qualified Java class name
        schema:
          type: string
      responses:
        '200':
          description: An excluded class
          content:
            '*/*':
              schema:
                type: object
                properties:
                  name:
                    $ref: '#/components/schemas/ClassName'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: getServicesByEnvIdSettingsCodeRedactionExcludeClassesByClassName
      x-operation-id-source: derived
    put:
      tags:
      - Code Redaction
      summary: Add a class to the exclusion list
      description: Add a class to the exclusion list. The body class name must match the resource identifier
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      - in: path
        name: class_name
        required: true
        description: Fully qualified Java class name
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Class'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: putServicesByEnvIdSettingsCodeRedactionExcludeClassesByClassName
      x-operation-id-source: derived
    delete:
      tags:
      - Code Redaction
      summary: Remove a class from exclusion
      description: Remove a class from the exclusion list
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      - in: path
        name: class_name
        required: true
        description: Fully qualified Java class name
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      operationId: deleteServicesByEnvIdSettingsCodeRedactionExcludeClassesByClassName
      x-operation-id-source: derived
  /services/{env_id}/settings/code-redaction/exclude/packages:
    get:
      tags:
      - Code Redaction
      summary: List all excluded packages
      parameters:
      - in: path
