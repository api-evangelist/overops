    put:
      tags:
      - Code Redaction
      summary: Add a package to the inclusion list
      description: Add a package to the inclusion list. The body package name must match the resource identifier
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      - in: path
        name: package_name
        required: true
