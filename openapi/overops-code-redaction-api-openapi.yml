openapi: 3.2.0
info:
  version: v1
  title: Services Code Redaction API
  contact:
    email: hello@overops.com
  description: Main OverOps API.
servers:
- url: https://api.overops.com/api/v1
security:
- basicAuth: []
- ApiKeyAuth: []
tags:
- name: Code Redaction
  description: Fetch and manipulate code filters to include / exclude 3rd party and utility classes from OverOps analysis and data capture.
paths:
  /services/{env_id}/settings/code-redaction:
    get:
      tags:
      - Code Redaction
      summary: List all environment code redaction settings
      description: List all environment code exclusions and inclusions
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of included and excluded classes and packages
          content:
            '*/*':
              schema:
                type: object
                properties:
                  exclude:
                    type: object
                    properties:
                      classes:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassName'
                      packages:
                        type: array
                        items:
                          $ref: '#/components/schemas/PackageName'
                  include:
                    type: object
                    properties:
                      classes:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassName'
                      packages:
                        type: array
                        items:
                          $ref: '#/components/schemas/PackageName'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: getServicesByEnvIdSettingsCodeRedaction
      x-operation-id-source: derived
  /services/{env_id}/settings/code-redaction/exclude:
    get:
      tags:
      - Code Redaction
      summary: List all code exclusions
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of excluded classes and packages
          content:
            '*/*':
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClassName'
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackageName'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: getServicesByEnvIdSettingsCodeRedactionExclude
      x-operation-id-source: derived
    post:
      tags:
      - Code Redaction
      summary: Add a bulk of code exclusions
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                classes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ClassName'
                packages:
                  type: array
                  items:
                    $ref: '#/components/schemas/PackageName'
        description: code exclusions
        required: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      operationId: postServicesByEnvIdSettingsCodeRedactionExclude
      x-operation-id-source: derived
  /services/{env_id}/settings/code-redaction/exclude/classes:
    get:
      tags:
      - Code Redaction
      summary: List all excluded classes
      parameters:
      - in: path
        name: env_id
        description: Environment ID to use (e.g. S1234)
        required: true
        schema:
